name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # gismo-sdk-go and gismo-contracts are public modules, resolved from
      # the public Go module proxy — no auth needed.
      - name: Dependency-pinning self-check
        run: |
          test -f go.sum || { echo "go.sum is missing — dependencies are not locked" >&2; exit 1; }
          echo "go.sum present — dependencies locked"

      - name: Build, vet, test (incl. conformance harness)
        run: |
          go build ./...
          go vet ./...
          go test ./...
